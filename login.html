<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYPO | Account</title>
    <link rel="stylesheet" href="https://pro.fontawesome.com/releases/v5.10.0/css/all.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="container" id="container">
        <div class="form-container sign-up">
            <form id="signup-form" novalidate>
                <h1>Create Account</h1>
                <!-- <div class="social-icons">
                    <a href="#" class="icon">
                        <i class="fa-brands fa-google-plus-g"></i>
                    </a>
                    <a href="#" class="icon">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>
                    <a href="#" class="icon">
                        <i class="fa-brands fa-github"></i>
                    </a>
                    <a href="#" class="icon">
                        <i class="fa-brands fa-linkedin-in"></i>
                    </a>
                </div>
                <span>or use your email for registeration</span> -->
                <p class="form-message" id="signup-message" role="status" aria-live="polite"></p>
                <label class="sr-only" for="signup-name">Full name</label>
                <input id="signup-name" type="text" placeholder="Full name" autocomplete="name" required>
                <label class="sr-only" for="signup-email">Email</label>
                <input id="signup-email" type="email" placeholder="Email address" autocomplete="email" required>
                <label class="sr-only" for="signup-password">Password</label>
                <input id="signup-password" type="password" placeholder="Password (8+ characters)" minlength="8" autocomplete="new-password" required>
                <button type="submit">Sign Up</button>
            </form>
        </div>

        <div class="form-container sign-in">
            <form id="login-form" novalidate>
                <h1>Sign In</h1>
                <!-- <div class="social-icons">
                    <a href="#" class="icon">
                        <i class="fa-brands fa-google-plus-g"></i>
                    </a>
                    <a href="#" class="icon">
                        <i class="fa-brands fa-facebook-f"></i>
                    </a>
                    <a href="#" class="icon">
                        <i class="fa-brands fa-github"></i>
                    </a>
                    <a href="#" class="icon">
                        <i class="fa-brands fa-linkedin-in"></i>
                    </a>
                </div>
                <span>or use your email password</span> -->
                <p class="form-message" id="login-message" role="status" aria-live="polite"></p>
                <label class="sr-only" for="login-email">Email</label>
                <input id="login-email" type="email" placeholder="Email address" autocomplete="email" required>
                <label class="sr-only" for="login-password">Password</label>
                <input id="login-password" type="password" placeholder="Password" autocomplete="current-password" required>
                <button type="submit">Sign In</button>
            </form>
        </div>

        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <h1>Welcome Back!</h1>
                    <p>Enter your personal details to use all of site features</p>
                    <button class="hidden" id="login">Sign In</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1>Hello, Friend!</h1>
                    <p>Register with your personal details to use all of site features</p>
                    <button class="hidden" id="register">Sign Up</button>
                </div>
            </div>
        </div>
    </div>


    <script src="login.js"></script>
</body>
</html>
